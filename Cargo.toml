[workspace]
members = ["shared"]
resolver = "3"

[workspace.package]
authors = ["Viktor Charypar"]
edition = "2024"
repository = "https://github.com/charypar/rust-nation-2024-egg-timer/"
license = "Apache-2.0"
keywords = ["crux", "RustNation", "cross-platform-ui", "ffi", "wasm"]
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0.100"
crux_core = { path = "../crux/crux_core/" }
serde = "1.0.228"
